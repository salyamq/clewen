name: checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[server,dev]'
      - run: ruff check src tools tests examples
      - run: ruff format --check src tools tests examples --exclude src/clewen/joint_schema_model.py
      - run: PYTHONPATH=src:tools python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m build
